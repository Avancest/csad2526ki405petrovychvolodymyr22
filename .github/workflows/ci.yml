name: Cross-platform Build and Test

on:
  push:
    branches:
      - "*develop*"
      - "*master*"
  pull_request:
    branches:
      - "*develop*"
      - "*master*"

jobs:
  cross_build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.1'

      - name: Verify CMake version
        run: cmake --version

      # ✅ Run CI script ONLY on Windows
      - name: Run CI script on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: ci.bat

      # Linux/macOS runners now skip ci.bat
      - name: Skip CI script on Linux/macOS
        if: runner.os != 'Windows'
        run: echo "⚠️ Skipping ci.bat on non-Windows runner"

      - name: Deploy
        run: echo "🚀 Deploy step (add real deployment commands here)"
