name: Cross-platform Build and Test

on:
  push:
    branches:
      - "*develop*"
      - "*master*"
  pull_request:
    branches:
      - "*develop*"
      - "*master*"

jobs:
  cross_build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.1'

      - name: Verify CMake version
        run: cmake --version

      # ✅ Run CI script on Windows
      - name: Run CI script (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ci.bat

      # ✅ Run CI script on Linux/macOS
      - name: Run CI script (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./ci.sh
          ./ci.sh

      - name: Deploy
        if: success()
        run: echo "🚀 Deploy step (add real deployment commands here)"
